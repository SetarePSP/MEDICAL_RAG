# deploy-backend.yml — Auto-deploy backend to Google Cloud Run on push to main.
# Required GitHub Secrets: GCP_PROJECT_ID, GCP_SA_KEY (service account JSON),
# GEMINI_API_KEY, SUPABASE_*, OPENAI_API_KEY (for /api/tts on Cloud Run), etc.

name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  REGION: us-central1
  SERVICE: medical-rag-api
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/medical-rag/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest backend/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          GEMINI_CHAT_MODEL=gemini-2.5-flash,\
          SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},\
          GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},\
          VERTEX_AI_LOCATION=us-central1,\
          GEMINI_EMBEDDING_BACKEND=vertex,\
          SENTRY_DSN=${{ secrets.SENTRY_DSN }},\
          LANGCHAIN_TRACING_V2=true,\
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }},\
          LANGCHAIN_PROJECT=medical-rag,\
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
          OPENAI_TTS_SPEED=1.12,\
          ENVIRONMENT=production"

      - name: Show deployed URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)"
