# deploy-backend.yml — Auto-deploy backend to Google Cloud Run on push to main.
#
# GitHub → Settings → Secrets and variables → Actions — use these names exactly:
#   Required for deploy + core app:
#     GCP_PROJECT_ID, GCP_SA_KEY, GEMINI_API_KEY,
#     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   Optional (empty secret = feature off / defaults):
#     OPENAI_API_KEY, SENTRY_DSN, LANGCHAIN_API_KEY, LANGCHAIN_ENDPOINT,
#     GOOGLE_PLACES_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# Model names below are set in YAML (not secrets) unless you prefer secrets later.

name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  REGION: us-central1
  SERVICE: medical-rag-api
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/medical-rag/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest backend/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          GEMINI_CHAT_MODEL=gemini-2.5-flash,\
          GEMINI_EMBEDDING_MODEL=models/text-embedding-004,\
          GEMINI_EMBEDDING_BACKEND=vertex,\
          GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},\
          VERTEX_AI_LOCATION=us-central1,\
          VERTEX_EMBEDDING_MODEL=text-embedding-004,\
          SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},\
          GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }},\
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},\
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},\
          STRIPE_CURRENCY=eur,\
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
          OPENAI_TTS_MODEL=tts-1,\
          OPENAI_TTS_VOICE=nova,\
          OPENAI_TTS_SPEED=1.12,\
          WHISPER_MODEL=tiny,\
          LANGCHAIN_TRACING_V2=true,\
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }},\
          LANGCHAIN_PROJECT=medical-rag,\
          LANGCHAIN_ENDPOINT=${{ secrets.LANGCHAIN_ENDPOINT }},\
          SENTRY_DSN=${{ secrets.SENTRY_DSN }},\
          ENVIRONMENT=production"

      - name: Show deployed URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)"
